<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Japan Job Toolkit Logo</title>
  <desc id="desc">A minimal torii gate and resume document icon with JJT badge.</desc>

  <!-- Transparent background by default -->

  <!-- Outer ring -->
  <circle cx="128" cy="128" r="104" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.95"/>

  <!-- Torii gate -->
  <path d="M48 54 H208 L198 72 H58 Z" fill="#e53935"/>
  <path d="M61 76 H195 V90 H61 Z" fill="#c62828"/>
  <rect x="72" y="84" width="18" height="92" rx="4" fill="#e53935"/>
  <rect x="166" y="84" width="18" height="92" rx="4" fill="#e53935"/>
  <rect x="56" y="104" width="144" height="16" rx="4" fill="#e53935"/>

  <!-- Resume document -->
  <path d="M92 98 H152 L174 120 V190 H92 Z" fill="#ffffff" stroke="#0d2f5f" stroke-width="8" stroke-linejoin="round"/>
  <path d="M152 98 V122 H174" fill="none" stroke="#0d2f5f" stroke-width="8" stroke-linejoin="round"/>

  <!-- Person -->
  <circle cx="118" cy="132" r="11" fill="#0d2f5f"/>
  <path d="M101 160 C101 145 135 145 135 160 V164 H101 Z" fill="#0d2f5f"/>

  <!-- Resume lines -->
  <rect x="144" y="132" width="20" height="6" rx="3" fill="#4f6b8a"/>
  <rect x="144" y="145" width="24" height="6" rx="3" fill="#4f6b8a"/>
  <rect x="104" y="174" width="54" height="6" rx="3" fill="#e53935"/>
  <rect x="104" y="187" width="48" height="6" rx="3" fill="#0d2f5f"/>

  <!-- JJT badge -->
  <circle cx="180" cy="180" r="38" fill="#0d2f5f" stroke="#ffffff" stroke-width="6"/>
  <text x="180" y="191" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="34" font-weight="700" fill="#ffffff">JJ</text>
  <path d="M186 157 H214 L210 164 H190 Z" fill="#e53935"/>
  <rect x="197" y="162" width="6" height="28" rx="2" fill="#e53935"/>
  <rect x="190" y="169" width="20" height="5" rx="2" fill="#e53935"/>
</svg>
